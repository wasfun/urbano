<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urbano Package Tracker & Map</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        #map { height: 450px; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Urbano Package Tracker</h1>
            <p class="text-gray-600 mt-2">Track your package status and live location on the map.</p>
        </div>

        <!-- Search Bar Card -->
        <div class="bg-white shadow-md rounded-lg p-6 mb-8">
            <div class="flex flex-col sm:flex-row gap-4">
                <input 
                    type="text" 
                    id="guiaInput" 
                    value="WYB475394208" 
                    placeholder="Enter Tracking Guide (e.g., WYB475394208)" 
                    class="flex-grow px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                <button 
                    onclick="fetchTrackingData()" 
                    id="trackBtn"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2 rounded-lg transition duration-200"
                >
                    Track Package
                </button>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div id="resultContainer" class="grid grid-cols-1 md:grid-cols-2 gap-8 hidden">
            <!-- Left Column: Status Timeline -->
            <div class="bg-white shadow-md rounded-lg p-6 flex flex-col">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Tracking History</h2>
                <div id="statusTimeline" class="space-y-4 overflow-y-auto max-h-[450px] pr-2">
                    <!-- Dynamically populated statuses -->
                </div>
            </div>

            <!-- Right Column: Interactive Map -->
            <div class="bg-white shadow-md rounded-lg p-6 flex flex-col">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Active Location</h2>
                <div id="map" class="rounded-lg shadow-inner z-0"></div>
                <div id="coordsInfo" class="mt-4 text-sm text-gray-600"></div>
            </div>
        </div>

        <!-- Loading / Error Message -->
        <div id="messageBox" class="text-center text-gray-500 py-12">
            Enter a tracking number and click "Track Package" to begin.
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        let map = null;
        let marker = null;

        async function fetchTrackingData() {
            const guiaBarra = document.getElementById('guiaInput').value.trim();
            const messageBox = document.getElementById('messageBox');
            const resultContainer = document.getElementById('resultContainer');
            const trackBtn = document.getElementById('trackBtn');

            if (!guiaBarra) {
                alert('Please enter a tracking guide.');
                return;
            }

            // UI Loading state
            trackBtn.disabled = true;
            trackBtn.innerText = 'Loading...';
            messageBox.classList.remove('hidden');
            messageBox.innerText = 'Fetching tracking information...';
            resultContainer.classList.add('hidden');

            try {
                const response = await fetch('https://api.urbanoenvios.pe/api/v1/trackingGlobal', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        "guia_barra": guiaBarra,
                        "flag_seller": 0
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // Hide message box and show results
                messageBox.classList.add('hidden');
                resultContainer.classList.remove('hidden');

                // Render Data (Adjust paths based on exact API JSON structure)
                renderTimeline(data);
                renderMap(data);

            } catch (error) {
                console.error('Error fetching tracking data:', error);
                messageBox.classList.remove('hidden');
                messageBox.innerHTML = `<span class="text-red-500">Failed to fetch data. Note: If you experience CORS errors, you may need a backend proxy to access this API from the browser.</span>`;
            } finally {
                trackBtn.disabled = false;
                trackBtn.innerText = 'Track Package';
            }
        }

        function renderTimeline(data) {
            const timelineContainer = document.getElementById('statusTimeline');
            timelineContainer.innerHTML = '';

            // Assuming the API returns an array of events/statuses under a property like `data.events`, `data.detalles`, or similar.
            // Modify `data.events || data.detalles || []` to match your exact API response array structure.
            const events = data.events || data.detalles || data.status_list || [];

            if (events.length === 0) {
                timelineContainer.innerHTML = '<p class="text-gray-500">No status history found in the response.</p>';
                return;
            }

            events.forEach((event, index) => {
                const isLatest = index === 0;
                const statusHTML = `
                    <div class="flex items-start space-x-3 border-l-2 ${isLatest ? 'border-blue-600' : 'border-gray-300'} pl-4 pb-4">
                        <div class="flex-shrink-0 w-3 h-3 rounded-full ${isLatest ? 'bg-blue-600' : 'bg-gray-400'} -ml-[21px] mt-1.5"></div>
                        <div>
                            <p class="font-semibold text-gray-800">${event.estado || event.status || 'Status Update'}</p>
                            <p class="text-sm text-gray-600">${event.descripcion || event.details || ''}</p>
                            <span class="text-xs text-gray-400">${event.fecha || event.date || ''} - ${event.lugar || event.location || ''}</span>
                        </div>
                    </div>
                `;
                timelineContainer.innerHTML += statusHTML;
            });
        }

        function renderMap(data) {
            // Adjust `data.gps_px` and `data.gps_py` paths if they are nested inside an object (e.g., data.ubi.gps_px)
            const lat = parseFloat(data.gps_px || data.latitude || -12.0464); // Default to Lima, Peru if missing
            const lng = parseFloat(data.gps_py || data.longitude || -77.0428);

            document.getElementById('coordsInfo').innerHTML = `<strong>Current Coordinates:</strong> Latitude: ${lat}, Longitude: ${lng}`;

            // Initialize map if not already created
            if (!map) {
                map = L.map('map').setView([lat, lng], 14);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap contributors'
                }).addTo(map);
            } else {
                map.setView([lat, lng], 14);
            }

            // Update or add marker
            if (marker) {
                marker.setLatLng([lat, lng]);
            } else {
                marker = L.marker([lat, lng]).addTo(map)
                    .bindPopup('Package Current Location')
                    .openPopup();
            }
        }
    </script>
</body>
</html>
